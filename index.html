<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Waste Classifier </title>
  <script src="script.js"></script>

  <!-- TensorFlow + Teachable Machine -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.4/dist/teachablemachine-image.min.js"></script>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1c1c1c, #2e2e2e);
      color: #fff;
      padding: 30px;
      text-align: center;
    }

    h1 {
      color: #e74c3c;
      margin-bottom: 20px;
    }

    button {
      padding: 12px 24px;
      font-size: 18px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .start-btn {
      background-color: #27ae60;
      color: white;
    }

    .start-btn:hover, .start-btn.active {
      background-color: #2ecc71;
    }

    .stop-btn {
      background-color: #e74c3c;
      color: white;
    }

    .stop-btn:hover, .stop-btn.active {
      background-color: #c0392b;
    }

    #webcam-container {
      margin-top: 30px;
    }

    #label-container div {
      margin: 8px auto;
      font-size: 18px;
      background: #333;
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      width: 280px;
      transition: background 0.3s ease;
    }

    .highlight {
      background-color: #f39c12 !important;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Waste Classifier (Teachable Machine)</h1>
  <button class="start-btn" id="startBtn" onclick="startWebcam()">Start</button>
  <button class="stop-btn" id="stopBtn" onclick="stopWebcam()">Stop</button>

  <div id="webcam-container"></div>
  <div id="label-container"></div>

  <script>
    const URL = "https://teachablemachine.withgoogle.com/models/ZCr4WhZos/";

    let model, webcam, labelContainer, maxPredictions, requestId;

    async function startWebcam() {
      document.getElementById('startBtn').classList.add('active');
      document.getElementById('stopBtn').classList.remove('active');

      const modelURL = URL + "model.json";
      const metadataURL = URL + "metadata.json";

      model = await tmImage.load(modelURL, metadataURL);
      maxPredictions = model.getTotalClasses();

      const flip = true;
      webcam = new tmImage.Webcam(224, 224, flip);
      await webcam.setup();
      await webcam.play();
      requestId = window.requestAnimationFrame(loop);

      document.getElementById("webcam-container").innerHTML = "";
      document.getElementById("webcam-container").appendChild(webcam.canvas);

      labelContainer = document.getElementById("label-container");
      labelContainer.innerHTML = "";
      for (let i = 0; i < maxPredictions; i++) {
        labelContainer.appendChild(document.createElement("div"));
      }
    }

    async function loop() {
      webcam.update();
      await predict();
      requestId = window.requestAnimationFrame(loop);
    }

    async function predict() {
      const prediction = await model.predict(webcam.canvas);
      let maxIndex = 0;
      for (let i = 1; i < prediction.length; i++) {
        if (prediction[i].probability > prediction[maxIndex].probability) {
          maxIndex = i;
        }
      }

      for (let i = 0; i < maxPredictions; i++) {
        const classPrediction =
          `${prediction[i].className}: ${(prediction[i].probability * 100).toFixed(1)}%`;
        const labelDiv = labelContainer.childNodes[i];
        labelDiv.innerHTML = classPrediction;
        labelDiv.classList.toggle("highlight", i === maxIndex);
      }
    }

    function stopWebcam() {
      document.getElementById('stopBtn').classList.add('active');
      document.getElementById('startBtn').classList.remove('active');

      if (webcam && webcam.stop) {
        webcam.stop();
      }

      if (requestId) {
        cancelAnimationFrame(requestId);
      }

      // Clear UI
      document.getElementById("webcam-container").innerHTML = "";
      document.getElementById("label-container").innerHTML = "";
    }
  </script>
</body>
</html>
